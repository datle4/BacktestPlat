spring:
  application:
    name: backtestplat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/backtestplat}
    username: ${DB_USER:backtestplat}
    password: ${DB_PASSWORD:local-backtestplat}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  market-data:
    cutoff: ${MARKET_DATA_CUTOFF:2026-09-20}
    import-enabled: ${MARKET_DATA_IMPORT_ENABLED:false}
    import-start: ${MARKET_DATA_IMPORT_START:2021-01-01}
