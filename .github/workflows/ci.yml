name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'test/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: backtestplat
          POSTGRES_USER: backtestplat
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U backtestplat -d backtestplat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend
      - name: Verify PostgreSQL integration
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/backtestplat
          TEST_DB_USER: backtestplat
          TEST_DB_PASSWORD: ci-only-password
        run: ./mvnw --batch-mode --no-transfer-progress test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  application-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the application stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 120
      - name: Seed isolated CI data
        run: docker compose exec -T db psql -v ON_ERROR_STOP=1 -U backtestplat -d backtestplat < frontend/integration/fixture.sql
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify real frontend / API / database flow
        run: npm run test:e2e:integration
        working-directory: frontend
      - name: Application logs
        if: always()
        run: docker compose --profile app logs --no-color --tail=100
      - name: Keep integration test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-integration
          path: frontend/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down
