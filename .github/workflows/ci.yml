name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Contract and infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse OpenAPI YAML
        run: >-
          ruby -e "require 'yaml'; spec = YAML.safe_load(File.read('contracts/openapi.yaml'), aliases: false);
          abort('OpenAPI version missing') unless spec['openapi'];
          abort('paths must be an object') unless spec['paths'].is_a?(Hash);
          abort('paths must stay empty in Feature 0') if spec['x-checkpoint'] == 'feature-0-foundation' && spec['paths'] != {};
          puts spec['info']['title']"

      - name: Validate development Compose
        run: docker compose --env-file .env.example -f infra/compose.yml config --quiet

      - name: Validate production Compose skeleton
        run: docker compose --env-file .env.example -f infra/compose.prod.yml config --quiet

      - name: Validate PostgreSQL role bootstrap script
        run: sh -n infra/postgres/init/01-create-app-role.sh

      - name: Verify PostgreSQL role separation guard
        run: |
          if env POSTGRES_USER=same POSTGRES_DB=vnstock APP_DB_USER=same APP_DB_PASSWORD=test-only \
            sh infra/postgres/init/01-create-app-role.sh; then
            echo "Role bootstrap accepted identical admin and application users." >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate OpenAPI semantics
        run: npm run lint:contract

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Foundation E2E and accessibility
        run: npm run test:e2e

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
